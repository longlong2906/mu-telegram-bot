[project]
name = "mu-telegram-bot"
version = "0.1.0"
description = "Vietnamese Manchester United match notifications on Telegram"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["httpx>=0.28.1,<0.29", "tzdata>=2025.2"]

[project.scripts]
mu-bot = "mu_bot.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mu_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".uv-cache", ".state"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
